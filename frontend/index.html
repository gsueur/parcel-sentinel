<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Location Sentinel</title>
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --faint: #94a3b8;
      --accent: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh;
    }
    .header {
      padding: 14px 24px; border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: baseline; gap: 12px; }
    .header h1 { font-size: 1.15rem; font-weight: 600; color: #0f172a; }
    .customer-badge {
      font-size: 0.78rem; color: var(--muted); background: var(--bg);
      border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px;
    }
    .header-right { display: flex; align-items: center; gap: 16px; }
    #loc-count { color: var(--muted); font-size: 0.8rem; }
    .btn {
      padding: 7px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 500;
      cursor: pointer; border: none; transition: opacity 0.15s; white-space: nowrap;
    }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; text-decoration: none; color: inherit;
      transition: border-color 0.15s; display: flex; flex-direction: column;
    }
    .card:not(.card-pending):hover { border-color: var(--accent); }
    .card-thumb { width: 100%; height: 110px; object-fit: cover; background: var(--border); display: block; }
    .card-thumb-placeholder { width: 100%; height: 110px; background: var(--border); }
    .card-thumb-computing {
      width: 100%; height: 110px; background: var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 22px; height: 22px; border: 2px solid var(--faint);
      border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    .card-body { padding: 11px 14px; }
    .card-name { font-weight: 600; color: #0f172a; font-size: 0.9rem; }
    .card-meta { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }
    .card-customer { font-size: 0.72rem; color: var(--faint); margin-top: 2px; }
    .card-key { font-size: 0.65rem; color: var(--faint); margin-top: 4px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-computing { font-size: 0.75rem; color: var(--accent); margin-top: 3px; }
    .card-failed { font-size: 0.75rem; color: var(--danger); margin-top: 3px; }
    .state-msg { color: var(--faint); padding: 48px 0; text-align: center; font-style: italic; }
    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.5);
      z-index: 200; display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      width: 92vw; max-width: 920px; max-height: 92vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .modal-header h2 { font-size: 0.95rem; font-weight: 600; color: #0f172a; }
    .close-btn { background: none; border: none; color: var(--faint); font-size: 1.3rem; cursor: pointer; padding: 0 4px; line-height: 1; }
    .close-btn:hover { color: var(--text); }
    .modal-body { display: flex; flex: 1; overflow: hidden; min-height: 0; }
    .form-section {
      width: 270px; flex-shrink: 0; padding: 18px;
      overflow-y: auto; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 13px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
    input[type="text"], input[type="date"], select {
      background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
      color: var(--text); padding: 6px 10px; font-size: 0.83rem;
      outline: none; width: 100%; font-family: inherit;
    }
    input:focus, select:focus { border-color: var(--accent); }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .map-section { flex: 1; position: relative; min-width: 0; }
    #map { width: 100%; height: 100%; min-height: 380px; }
    .leaflet-container { cursor: crosshair !important; }
    .map-hint {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.92); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 12px; font-size: 0.75rem; color: var(--muted);
      pointer-events: none; z-index: 1000; white-space: nowrap;
    }
    .status-box { font-size: 0.78rem; padding: 7px 10px; border-radius: 5px; line-height: 1.4; }
    .status-box.error { background: rgba(220,38,38,0.08); color: #b91c1c; border: 1px solid rgba(220,38,38,0.2); }
    .status-box.info { background: rgba(29,78,216,0.08); color: #1d4ed8; border: 1px solid rgba(29,78,216,0.2); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Location Sentinel</h1>
    <span id="customer-badge" class="customer-badge hidden"></span>
  </div>
  <div class="header-right">
    <span id="loc-count"></span>
    <button class="btn btn-primary" id="add-btn">+ Add Location</button>
  </div>
</div>

<div class="container">
  <div id="grid" class="grid">
    <p class="state-msg">Loading...</p>
  </div>
</div>

<!-- Add Location Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Add Location</h2>
      <button class="close-btn" id="close-btn">&#x2715;</button>
    </div>
    <div class="modal-body">

      <div class="form-section">
        <div class="field">
          <label for="loc-name">Name</label>
          <input type="text" id="loc-name" placeholder="e.g. Riverside Plot A">
        </div>

        <div class="field" id="customer-field">
          <label for="customer-select">Customer (optional)</label>
          <select id="customer-select">
            <option value="">No customer</option>
            <option value="__new__">+ New customer...</option>
          </select>
        </div>

        <div class="field hidden" id="new-customer-field">
          <label for="new-customer-name">Customer name</label>
          <input type="text" id="new-customer-name" placeholder="Customer name">
        </div>

        <div class="field">
          <label>Lookback: <strong id="lookback-val">5 years</strong></label>
          <input type="range" id="lookback" min="1" max="10" value="5">
        </div>

        <div class="field">
          <label for="date-end">Date end</label>
          <input type="date" id="date-end">
        </div>

        <div id="geom-status" class="status-box info hidden"></div>

        <button class="btn btn-primary" id="submit-btn" disabled>Analyze</button>

        <div id="form-status" class="hidden"></div>
      </div>

      <div class="map-section">
        <div class="map-hint" id="map-hint">Click on the map to place a point</div>
        <div id="map"></div>
      </div>

    </div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────────
const API_URL = window.location.hostname === 'localhost'
  ? 'http://localhost:8000'
  : 'https://climate.geomermaids.com';
// ─────────────────────────────────────────────────────────────────────────────────

// Fix default marker icon paths when Leaflet is loaded from CDN
delete L.Icon.Default.prototype._getIconUrl;
L.Icon.Default.mergeOptions({
  iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
  iconUrl:       'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
  shadowUrl:     'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
});

let map = null, marker = null, drawnGeometry = null;
const filterCustomerId = new URLSearchParams(window.location.search).get('customer_id');

// ── LOCATIONS ─────────────────────────────────────────────────────────────────────

async function loadLocations() {
  try {
    let locations, count;
    if (filterCustomerId) {
      const res = await fetch(`${API_URL}/v1/customers/${filterCustomerId}/locations`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      locations = data.locations;
      count = data.count;
      showCustomerBadge(data.customer.name);
    } else {
      const res = await fetch(`${API_URL}/v1/locations`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      locations = data.locations;
      count = data.count;
    }
    // Preserve any pending cards already in the grid
    const pending = [...document.querySelectorAll('.card-pending')];
    renderGrid(locations);
    pending.forEach(c => {
      if (!document.getElementById(c.id)) document.getElementById('grid').prepend(c);
    });
    document.getElementById('loc-count').textContent = `${count} location${count !== 1 ? 's' : ''}`;
  } catch (e) {
    document.getElementById('grid').innerHTML = `<p class="state-msg">Failed to load: ${e.message}</p>`;
  }
}

function renderGrid(locations) {
  const grid = document.getElementById('grid');
  if (!locations.length) {
    grid.innerHTML = '<p class="state-msg">No locations yet. Add one to get started.</p>';
    return;
  }
  grid.innerHTML = locations.map(loc => {
    const name = loc.name || 'Unnamed';
    const coords = loc.centroid
      ? `${loc.centroid[1] >= 0 ? '+' : ''}${loc.centroid[1].toFixed(4)},\u2009${loc.centroid[0] >= 0 ? '+' : ''}${loc.centroid[0].toFixed(4)}`
      : '';
    const updated = loc.updated_at ? loc.updated_at.slice(0, 10) : '';
    const meta = [coords, updated].filter(Boolean).join(' &middot; ');
    const customer = loc.customer_name ? `<div class="card-customer">${loc.customer_name}</div>` : '';
    const keyShort = loc.location_key.slice(0, 24) + '&hellip;';
    return `
      <a class="card" href="${API_URL}${loc.report_url}" target="_blank" rel="noopener">
        <img class="card-thumb" src="${API_URL}${loc.thumbnail_url}"
             alt="" onerror="this.outerHTML='<div class=card-thumb-placeholder></div>'">
        <div class="card-body">
          <div class="card-name">${name}</div>
          <div class="card-meta">${meta}</div>
          ${customer}
          <div class="card-key">${keyShort}</div>
        </div>
      </a>`;
  }).join('');
}

function showCustomerBadge(name) {
  const el = document.getElementById('customer-badge');
  el.textContent = name;
  el.classList.remove('hidden');
}

// ── PENDING CARD ──────────────────────────────────────────────────────────────────

function addPendingCard(jobId, name) {
  const card = document.createElement('div');
  card.className = 'card card-pending';
  card.id = `job-${jobId}`;
  card.innerHTML = `
    <div class="card-thumb-computing"><div class="spinner"></div></div>
    <div class="card-body">
      <div class="card-name">${name}</div>
      <div class="card-computing" id="job-status-${jobId}">Computing\u2026</div>
    </div>`;
  const grid = document.getElementById('grid');
  const empty = grid.querySelector('.state-msg');
  if (empty) empty.remove();
  grid.prepend(card);
}

function startBackgroundPoll(jobId) {
  let elapsed = 0;
  const interval = setInterval(async () => {
    elapsed += 3;
    const statusEl = document.getElementById(`job-status-${jobId}`);
    try {
      const res = await fetch(`${API_URL}/v1/jobs/${jobId}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const job = await res.json();

      if (job.status === 'ready') {
        clearInterval(interval);
        const doneCard = document.getElementById(`job-${jobId}`);
        if (doneCard) doneCard.remove();
        await loadLocations(); // re-renders grid with the completed location
      } else if (job.status === 'failed') {
        clearInterval(interval);
        const card = document.getElementById(`job-${jobId}`);
        if (card) {
          card.querySelector('.card-thumb-computing').outerHTML =
            '<div class="card-thumb-placeholder" style="background:rgba(220,38,38,0.08)"></div>';
        }
        if (statusEl) {
          statusEl.className = 'card-failed';
          statusEl.textContent = `Failed: ${job.error}`;
        }
      } else {
        if (statusEl) statusEl.textContent = `Computing\u2026 ${elapsed}s`;
      }
    } catch (e) {
      clearInterval(interval);
      if (statusEl) { statusEl.className = 'card-failed'; statusEl.textContent = `Error: ${e.message}`; }
    }
  }, 3000);
}

// ── CUSTOMERS ─────────────────────────────────────────────────────────────────────

async function loadCustomers() {
  try {
    const res = await fetch(`${API_URL}/v1/customers`);
    if (!res.ok) return;
    const data = await res.json();
    if (!data.customers.length) return;
    const select = document.getElementById('customer-select');
    const newOpt = select.lastElementChild;
    data.customers.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.customer_id;
      opt.textContent = c.name;
      select.insertBefore(opt, newOpt);
    });
    // Pre-select after populating (filterCustomerId handled here too)
    if (filterCustomerId) select.value = filterCustomerId;
  } catch (_) {}
}

// ── MODAL ─────────────────────────────────────────────────────────────────────────

document.getElementById('add-btn').addEventListener('click', openModal);
document.getElementById('close-btn').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

function openModal() {
  // Hide customer selector when locked to a customer
  if (filterCustomerId) {
    document.getElementById('customer-field').classList.add('hidden');
    document.getElementById('new-customer-field').classList.add('hidden');
  } else {
    const select = document.getElementById('customer-select');
    while (select.options.length > 2) select.remove(1);
    loadCustomers();
  }

  document.getElementById('modal-overlay').classList.add('open');

  if (!map) {
    requestAnimationFrame(() => requestAnimationFrame(initMap));
  } else {
    map.invalidateSize();
  }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  resetForm();
}

// ── MAP ───────────────────────────────────────────────────────────────────────────

function initMap() {
  map = L.map('map').setView([39.5, -98.5], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);
  map.on('click', e => placeMarker(e.latlng));
}

function placeMarker(latlng) {
  if (marker) {
    marker.setLatLng(latlng);
  } else {
    marker = L.marker(latlng, { draggable: true }).addTo(map);
    marker.on('dragend', () => setGeometry(marker.getLatLng()));
  }
  setGeometry(latlng);
}

function setGeometry(latlng) {
  drawnGeometry = { type: 'Point', coordinates: [latlng.lng, latlng.lat] };
  const el = document.getElementById('geom-status');
  el.textContent = 'Point placed \u2014 drag to adjust';
  el.className = 'status-box info';
  el.classList.remove('hidden');
  document.getElementById('map-hint').classList.add('hidden');
  updateSubmit();
}

// ── CUSTOMER SELECT ───────────────────────────────────────────────────────────────

document.getElementById('customer-select').addEventListener('change', function () {
  document.getElementById('new-customer-field').classList.toggle('hidden', this.value !== '__new__');
});

// ── LOOKBACK ──────────────────────────────────────────────────────────────────────

document.getElementById('lookback').addEventListener('input', function () {
  document.getElementById('lookback-val').textContent = `${this.value} year${this.value > 1 ? 's' : ''}`;
});

// ── DATE DEFAULT ──────────────────────────────────────────────────────────────────

document.getElementById('date-end').value = new Date().toISOString().slice(0, 10);

// ── SUBMIT STATE ──────────────────────────────────────────────────────────────────

function updateSubmit() {
  const ready = drawnGeometry !== null && document.getElementById('loc-name').value.trim().length > 0;
  document.getElementById('submit-btn').disabled = !ready;
}

document.getElementById('loc-name').addEventListener('input', updateSubmit);

// ── SUBMIT ────────────────────────────────────────────────────────────────────────

document.getElementById('submit-btn').addEventListener('click', async () => {
  const name = document.getElementById('loc-name').value.trim();
  const lookback = parseInt(document.getElementById('lookback').value);
  const dateEnd = document.getElementById('date-end').value;
  const submitBtn = document.getElementById('submit-btn');

  if (!name || !drawnGeometry) return;

  // When locked to a customer, use filterCustomerId directly
  let customerId = filterCustomerId || null;
  if (!filterCustomerId) {
    const customerVal = document.getElementById('customer-select').value;
    customerId = (customerVal === '' || customerVal === '__new__') ? null : customerVal;

    if (customerVal === '__new__') {
      const newName = document.getElementById('new-customer-name').value.trim();
      if (!newName) { setFormStatus('error', 'Enter a customer name.'); return; }
      try {
        const r = await fetch(`${API_URL}/v1/customers`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newName }),
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        customerId = (await r.json()).customer_id;
      } catch (e) {
        setFormStatus('error', `Could not create customer: ${e.message}`);
        return;
      }
    }
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting\u2026';

  try {
    const res = await fetch(`${API_URL}/v1/locations`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ geometry: drawnGeometry, name, customer_id: customerId, date_end: dateEnd, lookback_years: lookback }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: `HTTP ${res.status}` }));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }

    const { job_id } = await res.json();
    closeModal();
    addPendingCard(job_id, name);
    startBackgroundPoll(job_id);
  } catch (e) {
    setFormStatus('error', `Error: ${e.message}`);
    submitBtn.disabled = false;
    submitBtn.textContent = 'Analyze';
  }
});

// ── HELPERS ───────────────────────────────────────────────────────────────────────

function setFormStatus(type, msg) {
  const el = document.getElementById('form-status');
  el.innerHTML = msg;
  el.className = `status-box ${type}`;
  el.classList.remove('hidden');
}

function resetForm() {
  document.getElementById('loc-name').value = '';
  if (!filterCustomerId) {
    document.getElementById('customer-select').value = '';
    document.getElementById('new-customer-field').classList.add('hidden');
    document.getElementById('new-customer-name').value = '';
  }
  document.getElementById('lookback').value = '2';
  document.getElementById('lookback-val').textContent = '2 years';
  document.getElementById('date-end').value = new Date().toISOString().slice(0, 10);
  document.getElementById('geom-status').classList.add('hidden');
  document.getElementById('form-status').classList.add('hidden');
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('submit-btn').textContent = 'Analyze';
  document.getElementById('map-hint').classList.remove('hidden');
  drawnGeometry = null;
  if (marker) { marker.remove(); marker = null; }
}

// ── INIT ──────────────────────────────────────────────────────────────────────────
loadLocations();
</script>
</body>
</html>
